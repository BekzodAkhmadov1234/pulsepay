spring.application.name=pulsepay

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/pulsedatabase
spring.datasource.username=pulseuser
spring.datasource.password=pulsepassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# ddl-auto=none: Liquibase is the single source of truth for schema — Hibernate must not
# interfere. 'validate' would race against Liquibase at startup and always lose.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Stage feature gates
stage2.enabled=false
stage3.enabled=false

# Cache (ConcurrentMapCacheManager — production should use Caffeine or Redis)
spring.cache.type=simple
pulsepay.cache.regulatory-parameters.ttl-seconds=60

# OTP discipline (REG-03/AUTH-03) — configurable, not hardcoded
# 59-second expiry per spec; 3-attempt cap; 15-minute lockout
pulsepay.otp.validity-seconds=59
pulsepay.otp.max-attempts=3
pulsepay.otp.lockout-minutes=15

# JWT
pulsepay.jwt.secret=change-me-in-production-must-be-at-least-256-bits-long-secret-key
pulsepay.jwt.user-expiry-seconds=900
pulsepay.jwt.refresh-expiry-seconds=2592000
pulsepay.jwt.admin-expiry-seconds=3600
