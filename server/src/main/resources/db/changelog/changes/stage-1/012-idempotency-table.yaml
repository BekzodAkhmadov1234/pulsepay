databaseChangeLog:
  - changeSet:
      id: 012-idempotency-keys
      author: pulsepay
      changes:
        - createTable:
            tableName: idempotency_keys
            columns:
              - column:
                  name: key
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: request_hash
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: response_snapshot
                  type: JSONB
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: idempotency_keys
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_idempotency_keys_user
        - createIndex:
            tableName: idempotency_keys
            indexName: idx_idempotency_keys_expires
            columns:
              - column:
                  name: expires_at
