databaseChangeLog:
  - changeSet:
      id: s03-transfer-types
      author: pulsepay
      changes:
        - insert:
            tableName: transfer_types
            columns:
              - column:
                  name: code
                  value: p2p
              - column:
                  name: name_uz
                  value: Person-to-person transfer
              - column:
                  name: requires_kyc
                  valueBoolean: true
              - column:
                  name: requires_kyb
                  valueBoolean: false
              - column:
                  name: allowed_sender_party_types
                  value: "{person}"
              - column:
                  name: allowed_recipient_party_types
                  value: "{person}"
              - column:
                  name: launch_stage
                  valueNumeric: 1
              - column:
                  name: is_active
                  valueBoolean: true
        - insert:
            tableName: transfer_types
            columns:
              - column:
                  name: code
                  value: p2a
              - column:
                  name: name_uz
                  value: Person-to-account transfer
              - column:
                  name: requires_kyc
                  valueBoolean: true
              - column:
                  name: requires_kyb
                  valueBoolean: false
              - column:
                  name: allowed_sender_party_types
                  value: "{person}"
              - column:
                  name: allowed_recipient_party_types
                  value: "{person,business}"
              - column:
                  name: launch_stage
                  valueNumeric: 3
              - column:
                  name: is_active
                  valueBoolean: false
        - insert:
            tableName: transfer_types
            columns:
              - column:
                  name: code
                  value: c2b
              - column:
                  name: name_uz
                  value: Consumer-to-business (merchant) payment
              - column:
                  name: requires_kyc
                  valueBoolean: true
              - column:
                  name: requires_kyb
                  valueBoolean: false
              - column:
                  name: allowed_sender_party_types
                  value: "{person}"
              - column:
                  name: allowed_recipient_party_types
                  value: "{merchant}"
              - column:
                  name: launch_stage
                  valueNumeric: 2
              - column:
                  name: is_active
                  valueBoolean: false
        - insert:
            tableName: transfer_types
            columns:
              - column:
                  name: code
                  value: b2b
              - column:
                  name: name_uz
                  value: Business-to-business transfer
              - column:
                  name: requires_kyc
                  valueBoolean: false
              - column:
                  name: requires_kyb
                  valueBoolean: true
              - column:
                  name: allowed_sender_party_types
                  value: "{business}"
              - column:
                  name: allowed_recipient_party_types
                  value: "{business}"
              - column:
                  name: launch_stage
                  valueNumeric: 3
              - column:
                  name: is_active
                  valueBoolean: false
        - insert:
            tableName: transfer_types
            columns:
              - column:
                  name: code
                  value: b2c
              - column:
                  name: name_uz
                  value: Business-to-consumer transfer (payroll/refund)
              - column:
                  name: requires_kyc
                  valueBoolean: true
              - column:
                  name: requires_kyb
                  valueBoolean: true
              - column:
                  name: allowed_sender_party_types
                  value: "{business}"
              - column:
                  name: allowed_recipient_party_types
                  value: "{person}"
              - column:
                  name: launch_stage
                  valueNumeric: 3
              - column:
                  name: is_active
                  valueBoolean: false
