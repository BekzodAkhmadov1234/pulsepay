                  name: account_type_id
                  valueNumeric: 1
              - column:
                  name: normal_balance
                  value: debit
              - column:
                  name: code
                  value: humo_clearing
              - column:
                  name: currency_code
                  value: UZS
              - column:
                  name: status
                  value: open
        - insert:
            tableName: ledger_accounts
            columns:
              - column:
                  name: id
                  value: 10000000-0000-0000-0000-000000000003
              - column:
                  name: account_type_id
                  valueNumeric: 3
              - column:
                  name: normal_balance
                  value: credit
              - column:
                  name: code
