databaseChangeLog:
  - changeSet:
      id: 202-reconciliations
      author: pulsepay
      changes:
        - createTable:
            tableName: reconciliations
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: settlement_batch_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: external_report_reference
                  type: TEXT
              - column:
                  name: internal_total_amount
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: external_total_amount
                  type: BIGINT
              - column:
                  name: discrepancy_amount
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(15)
                  defaultValue: under_review
                  constraints:
                    nullable: false
              - column:
                  name: resolved_at
                  type: TIMESTAMPTZ
              - column:
                  name: resolved_by_admin_id
                  type: UUID
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: reconciliations
            baseColumnNames: settlement_batch_id
            referencedTableName: settlement_batches
            referencedColumnNames: id
            constraintName: fk_reconciliations_batch
        - addForeignKeyConstraint:
            baseTableName: reconciliations
            baseColumnNames: resolved_by_admin_id
            referencedTableName: admins
            referencedColumnNames: id
            constraintName: fk_reconciliations_resolved_by
        - sql:
            sql: ALTER TABLE reconciliations ADD CONSTRAINT chk_rec_status CHECK (status IN ('matched','discrepancy','under_review','resolved'));
