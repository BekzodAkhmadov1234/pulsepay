databaseChangeLog:
  - changeSet:
      id: s04-purpose-codes
      author: pulsepay
      comment: 16 mandatory P2P purpose codes per Central Bank letter 17 Feb 2026
      changes:
        - insert:
            tableName: purpose_codes
            columns:
              - column:
                  name: code
                  value: goods_payment
              - column:
                  name: name_uz
                  value: Payment for goods
              - column:
                  name: applicable_transfer_type_id
                  valueNumeric: 1
              - column:
                  name: is_regulatory_required
                  valueBoolean: true
              - column:
                  name: is_active
                  valueBoolean: true
